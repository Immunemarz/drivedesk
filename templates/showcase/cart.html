{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | DriveDesk Supply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" href="{% static 'images/drivedesk-logo.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=coupons-20260510">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    {% include "showcase/partials/header.html" %}

    <main class="cart-page">
        <section class="cart-shell">
            <div class="cart-main">
                <p class="eyebrow">Your Cart</p>
                
                <div class="cart-actions">
                    <a class="nav-link-quiet" href="{% url 'products' %}">Continue Shopping</a>
                    <button id="clear-cart-button" class="nav-link-quiet danger" type="button">Clear Cart</button>
                </div>
                <div id="cart-items" class="cart-items"></div>
                <p id="cart-empty" class="cart-empty">Your cart is empty right now.</p>
                
            </div>

            <aside class="cart-summary">
                <p class="eyebrow">Summary</p>
                <div class="cart-line">
                    <span>Items</span>
                    <strong id="cart-item-count">0</strong>
                </div>
                <div class="cart-line">
                    <span>Subtotal</span>
                    <strong id="cart-subtotal">$0.00</strong>
                </div>
                <form class="coupon-form">
                    <label for="coupon-code">Coupon code</label>
                    <div class="coupon-row">
                        <input id="coupon-code" type="text" placeholder="Enter code" autocomplete="off">
                        <button type="submit">Apply</button>
                    </div>
                    <button id="remove-coupon-button" class="coupon-remove" type="button" hidden>Remove coupon</button>
                    <small id="coupon-status" class="coupon-status" aria-live="polite"></small>
                </form>
                <div id="cart-discount-line" class="cart-line" hidden>
                    <span>Discount</span>
                    <strong id="cart-discount">-$0.00</strong>
                </div>
                <div class="cart-line total">
                    <span>Total</span>
                    <strong id="cart-total">$0.00</strong>
                </div>
                <a id="cart-checkout-link" class="nav-cta disabled-link" href="{% url 'products' %}">Checkout Cart</a>
            </aside>
        </section>
    </main>

    {{ products|json_script:"catalog-data" }}
</body>
</html>
